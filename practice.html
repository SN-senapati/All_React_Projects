<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vanilla Form Register</title>
</head>
<body>

    <!-- 1. Create the HTML Input Element -->
    <input type="text" id="usernameInput" placeholder="Type something here..." />
    <script>
        // 2. Your custom useForm hook (corrected)
        function useForm() {
            return {
                register: function(fieldName) {
                    return {
                        name: fieldName,
                        onChange: function(event) {
                            // Fix: Use event.target.value to get the input text
                            console.log(event.target.value); 
                        }
                    }
                }
            }
        }
        
        const {register} = useForm() // register {name:,onchange}
        let input = document.getElementById("usernameInput")
        let inputAttribute = register("username")
        input.name = inputAttribute.name
        input.addEventListener("input", inputAttribute.onChange)
    </script>
</body>
</html>
